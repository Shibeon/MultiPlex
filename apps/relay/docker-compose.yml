# Relais « Regarder ensemble » de MultiPlex, à lancer sur un NAS ou un serveur.
# Il doit être joignable en HTTPS depuis Internet (proxy inverse du NAS, ou tunnel) :
# voir README.md.
services:
  multiplex-relay:
    build: .
    container_name: multiplex-relay
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - MAX_PEERS=16
      # - PLEX_URL=http://192.168.1.10:32400  # séances visibles par vos amis (voir README)
    read_only: true
    security_opt:
      - no-new-privileges:true
