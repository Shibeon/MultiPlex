# Version web de MultiPlex : fichiers statiques uniquement. L'application parle directement aux
# serveurs Plex depuis le navigateur ; ce serveur ne voit passer ni jeton ni vidéo.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Fichiers au nom haché : immuables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Page, service worker et manifeste : toujours revérifiés, pour que les mises à jour arrivent.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}
