# Raccourcis ajoutés à ceux de mpv (espace, flèches, f, m, 9/0, j, #…).
# Quitter la lecture rend la main à l'interface de MultiPlex.
ESC quit
BS quit
q quit
Q quit
MBTN_BACK quit
# Double-clic : plein écran ; clic droit : pause.
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT cycle pause
# Pistes : a = audio, s = sous-titres, i = statistiques.
a cycle audio
s cycle sub
i script-binding stats/display-stats-toggle
