name: web-image

# Image Docker de la version web, publiée sur ghcr.io/shibeon/multiplex-web pour l'héberger
# soi-même (voir apps/web/compose.yml). Construite pour amd64 et arm64.
#
# Publiée avec chaque version web (appelée par build.yml), ou à la demande (onglet Actions →
# « Run workflow »). Balises : `latest` et le numéro de version web (versions.json).
#
# Le dépôt du code étant privé, le paquet naît privé : le rendre public une fois pour toutes
# (GitHub → Packages → multiplex-web → Package settings → Change visibility → Public).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version de l'application
        id: v
        run: echo "app=$(node scripts/versions.mjs get web)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/shibeon/multiplex-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.v.outputs.app }}
          labels: |
            org.opencontainers.image.title=MultiPlex web
            org.opencontainers.image.description=Version web de MultiPlex, client Plex communautaire
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
