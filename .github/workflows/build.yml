name: build

# À chaque envoi : vérification des types, tests et paquets web / TV.
#
# Chaque plateforme a son numéro de version (versions.json) : bureau (Windows,
# macOS, Linux), web, Android (téléphone, tablette, Android TV) et TV (LG webOS,
# Samsung Tizen). Publier : envoyer sur `main` un numéro pas encore publié, avec
# son entrée dans apps/web/src/changelog.json (`pnpm release <plateformes…>`).
# Seules les plateformes dont le numéro a changé sont compilées et publiées.
#
# Bureau : la version est préparée en brouillon, Windows, macOS et Linux y
# déposent leurs fichiers, puis elle devient publique — seulement si les trois
# ont réussi. L'application installée propose alors la mise à jour.
# Web, Android, TV : publiées sous les étiquettes web-v…, android-v…, tv-v…,
# jamais marquées « Latest » (réservé au bureau, que lit sa mise à jour automatique).
#
# À la demande (onglet Actions → « Run workflow ») : compilation seule, sans
# publication, pour récupérer les installeurs dans les artefacts. Ces
# compilations ne tournent pas à chaque envoi : sur un dépôt privé, les minutes
# de calcul sont comptées, et celles de macOS coûtent dix fois plus cher.
#
# Les versions sont publiées dans un dépôt public à part, pour que le code puisse
# rester privé : son adresse est dans apps/desktop/package.json (build.publish).
# Secrets : RELEASES_TOKEN (jeton autorisé à écrire dans ce dépôt) ; pour Android,
# ANDROID_KEYSTORE (keystore en base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD (voir le README).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:tv
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: tv-tizen-webos
          path: dist-platforms


  # Envoi sur main : quelles plateformes ont un numéro pas encore publié ?
  # Bureau : un seul brouillon créé ici, avant les compilations — quand chaque système
  # essayait de créer la version en même temps, GitHub refusait (« Published releases
  # must have a valid tag ») et seule la version Windows était publiée.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.prepare.outputs.desktop }}
      web: ${{ steps.prepare.outputs.web }}
      android: ${{ steps.prepare.outputs.android }}
      tv: ${{ steps.prepare.outputs.tv }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret RELEASES_TOKEN absent : impossible de publier (voir le README, « Mises à jour automatiques »)." >&2
            exit 1
          fi
          node scripts/versions.mjs check
          repo=$(node -p "const p = require('./apps/desktop/package.json').build.publish[0]; p.owner + '/' + p.repo")
          state() { gh release view "$1" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null || echo none; }

          for p in web android tv; do
            tag="$p-v$(node scripts/versions.mjs get $p)"
            if [ "$(state "$tag")" = false ]; then
              echo "$tag déjà publiée."
              echo "$p=false" >> "$GITHUB_OUTPUT"
            elif [ $p = android ] && [ "$HAS_KEYSTORE" != true ]; then
              echo "::warning::$tag non publiée : secret ANDROID_KEYSTORE absent (voir le README, « Android »). Elle le sera au prochain envoi sur main une fois les secrets ajoutés."
              echo "$p=false" >> "$GITHUB_OUTPUT"
            else
              echo "$tag à publier."
              echo "$p=true" >> "$GITHUB_OUTPUT"
            fi
          done

          version=$(node scripts/versions.mjs get desktop)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft=$(state "$tag")
          if [ "$draft" = false ]; then
            echo "$tag (bureau) déjà publiée."
            echo desktop=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Page de la version sur GitHub : nouveautés en texte lisible. L'application installée lit,
          # elle, le JSON écrit dans « latest.yml » et le manifeste à chaud (étape bureau).
          node scripts/versions.mjs notes desktop release-body.md --md
          if [ "$draft" = none ]; then
            gh release create "$tag" --repo "$repo" --draft --title "$version" --notes-file release-body.md
            echo "$tag (bureau) préparée en brouillon."
          else
            gh release edit "$tag" --repo "$repo" --notes-file release-body.md
            echo "$tag (bureau) : brouillon existant repris."
          fi
          echo desktop=true >> "$GITHUB_OUTPUT"

  desktop:
    needs: [web, release]
    if: ${{ !cancelled() && needs.web.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release.outputs.desktop == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:mpv
      - run: pnpm build

      # À la demande : simple compilation. Sur un envoi de nouvelle version : les fichiers
      # sont déposés dans le brouillon, avec le fichier « latest » que lit la mise à jour automatique.
      - name: Compiler l'application
        shell: bash
        working-directory: apps/desktop
        run: |
          publish=never
          if [[ "$PUBLISH" == true ]]; then publish=always; fi
          node ../../scripts/versions.mjs notes desktop release-notes.txt
          # Clé de la base (embarquée dans l'app) et paquet de mise à jour à chaud (voir boot.cjs).
          node ../../scripts/hot-bundle.mjs
          pnpm exec electron-builder --publish "$publish" -c.releaseInfo.releaseNotesFile=release-notes.txt
          # Le paquet à chaud rejoint la version en brouillon : une app installée sur la même base
          # le téléchargera pendant qu'elle tourne, et « Redémarrer » suffira.
          if [[ "$PUBLISH" == true ]]; then
            repo=$(node -p "const p = require('./package.json').build.publish[0]; p.owner + '/' + p.repo")
            gh release upload "$TAG" hot-out/hot-*.json hot-out/MultiPlex-hot-*.asar --repo "$repo" --clobber
          fi
        env:
          PUBLISH: ${{ needs.release.outputs.desktop }}
          TAG: ${{ needs.release.outputs.tag }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Un système plus lent dépose quand même ses fichiers dans une version déjà publiée.
          EP_GH_IGNORE_TIME: 'true'

      # Chaque système publie la version dès que ses fichiers sont déposés, sans attendre les
      # autres : le premier la rend publique, les suivants y ajoutent les leurs. En attendant,
      # une app sur un système pas encore prêt ne trouve simplement pas de mise à jour.
      - name: Publier la version
        if: needs.release.outputs.desktop == 'true'
        shell: bash
        run: |
          repo=$(node -p "const p = require('./apps/desktop/package.json').build.publish[0]; p.owner + '/' + p.repo")
          node scripts/versions.mjs notes desktop release-body.md --md
          gh release edit "$TAG" --repo "$repo" --draft=false --latest --notes-file release-body.md
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  # Après les compilations (même si l'une a échoué) : étiquette du commit publié et
  # remise en texte lisible des anciennes pages de version.
  publish:
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages de version lisibles
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          repo=$(node -p "const p = require('./apps/desktop/package.json').build.publish[0]; p.owner + '/' + p.repo")
          # Aucun système n'a réussi : la version reste en brouillon, rien à étiqueter.
          if [ "$(gh release view "$TAG" --repo "$repo" --json isDraft -q .isDraft)" = true ]; then
            echo "$TAG toujours en brouillon."
            echo "UNPUBLISHED=1" >> "$GITHUB_ENV"
          fi
          # Anciennes versions dont la page affichait le JSON destiné à l'application : remises
          # en texte lisible (sans effet sur les mises à jour, qui lisent « latest.yml »).
          for t in $(gh release list --repo "$repo" --limit 100 --json tagName -q '.[].tagName'); do
            gh release view "$t" --repo "$repo" --json body -q .body > old-body.json || continue
            rm -f fixed-body.md
            node scripts/versions.mjs body "${t#v}" fixed-body.md < old-body.json
            if [ -s fixed-body.md ]; then gh release edit "$t" --repo "$repo" --notes-file fixed-body.md; fi
          done
      - name: Étiqueter le commit publié
        if: env.UNPUBLISHED != '1'
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

  # Android : APK signé publié quand son numéro change ; à la demande, APK de débogage.
  android:
    needs: [web, release]
    if: ${{ !cancelled() && needs.web.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:sync
      - name: APK de débogage (téléphone, tablette, Android TV, Fire TV)
        if: needs.release.outputs.android != 'true'
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: APK signé
        if: needs.release.outputs.android == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          version=$(node ../../../scripts/versions.mjs get android)
          mkdir -p ../../../out
          cp app/build/outputs/apk/release/app-release.apk "../../../out/MultiPlex-$version.apk"
      - name: Publier
        if: needs.release.outputs.android == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: scripts/publish-release.sh android out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            out/*.apk

  # Web : archive du site à déposer sur son serveur.
  web-release:
    needs: [web, release]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.release.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - name: Publier
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          version=$(node scripts/versions.mjs get web)
          (cd web && zip -qr "../MultiPlex-web-$version.zip" .)
          scripts/publish-release.sh web "MultiPlex-web-$version.zip"

  # Image Docker de la version web (ghcr.io/shibeon/multiplex-web).
  web-image:
    needs: web-release
    uses: ./.github/workflows/web-image.yml
    permissions:
      contents: read
      packages: write

  # TV : paquet LG webOS (.ipk, installable en mode développeur) et dossier Samsung
  # Tizen (à signer avec un certificat Samsung dans Tizen Studio avant installation).
  tv-release:
    needs: [web, release]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.release.outputs.tv == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: tv-tizen-webos
          path: dist-platforms
      - name: Paquets
        run: |
          version=$(node scripts/versions.mjs get tv)
          mkdir out
          npx --yes -p @webos-tools/cli@3 ares-package dist-platforms/webos -o out
          mv out/*.ipk "out/MultiPlex-webos-$version.ipk"
          (cd dist-platforms/tizen && zip -qr "../../out/MultiPlex-tizen-$version.zip" .)
          ls -l out
      - name: Publier
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: scripts/publish-release.sh tv out/*
