name: build

# À chaque envoi : vérification des types, tests et paquets web / TV.
# Sur une étiquette `v1.2.3`, ou à la demande (onglet Actions → « Run workflow ») :
# compilation des applications Windows, macOS, Linux et de l'APK Android. Ces
# compilations ne tournent pas à chaque envoi : sur un dépôt privé, les minutes
# de calcul sont comptées, et celles de macOS coûtent dix fois plus cher.
# Sur une étiquette, ou à la demande avec la case « Publier la version » cochée,
# les applications de bureau sont en plus publiées comme version GitHub, que
# l'application installée propose en mise à jour ; l'étiquette `v…` est alors
# créée ici si elle manque (utile quand on ne peut pas l'envoyer soi-même).
# De même, un envoi sur `main` dont la version (apps/desktop/package.json) n'a
# pas encore d'étiquette est compilé, publié puis étiqueté : changer le numéro
# de version sur `main` suffit à sortir une mise à jour.
#
# Les versions sont publiées dans un dépôt public à part, pour que le code puisse
# rester privé : son adresse est dans apps/desktop/package.json (build.publish).
# Le secret RELEASES_TOKEN doit contenir un jeton autorisé à y écrire.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier la version (celle de apps/desktop/package.json) pour la mise à jour automatique"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:tv
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: tv-tizen-webos
          path: dist-platforms

  # Envoi sur main : la version de l'application a-t-elle déjà été publiée ?
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag déjà publiée : pas de nouvelle version."
            echo release=false >> "$GITHUB_OUTPUT"
          else
            echo "$tag pas encore publiée : compilation et publication."
            echo release=true >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: [web, version]
    if: ${{ !cancelled() && needs.web.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.version.outputs.release == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) || needs.version.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:mpv
      - run: pnpm build

      - name: Vérifier que l'étiquette correspond à la version de l'application
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à la version $version de apps/desktop/package.json" >&2
            exit 1
          fi

      - name: Vérifier que le jeton de publication est défini
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret RELEASES_TOKEN absent : impossible de publier la version (voir le README, « Mises à jour automatiques »)." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Hors étiquette : simple compilation. Sur une étiquette : publication de la version,
      # avec le fichier « latest » que lit la mise à jour automatique.
      - name: Compiler l'application
        shell: bash
        working-directory: apps/desktop
        run: |
          publish=never
          if [[ "$PUBLISH" == true ]]; then publish=always; fi
          # Les nouveautés de la version accompagnent la publication (affichées par l'app installée).
          node ../../scripts/release-notes.mjs
          pnpm exec electron-builder --publish "$publish" -c.releaseInfo.releaseNotesFile=release-notes.txt
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  # Publication lancée à la main ou par un envoi sur main : l'étiquette de la version est posée sur le commit publié.
  # (Une étiquette envoyée par ce jeton ne relance pas le build.)
  tag:
    needs: [desktop, version]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || needs.version.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poser l'étiquette de la version
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "L'étiquette $tag existe déjà."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

  android:
    needs: [web, version]
    if: ${{ !cancelled() && needs.web.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.version.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:sync
      - name: APK de débogage (téléphone, tablette, Android TV, Fire TV)
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
