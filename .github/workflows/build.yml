name: build

# À chaque envoi : vérification des types, tests et paquets web / TV.
#
# Publication d'une mise à jour : il suffit d'envoyer sur `main` un numéro de
# version (apps/desktop/package.json) qui n'a pas encore été publié, avec son
# entrée dans apps/web/src/changelog.json. Le build prépare alors la version en
# brouillon, compile Windows, macOS, Linux et l'APK Android, y dépose les
# fichiers, puis la rend publique — seulement si toutes les plateformes ont
# réussi. En cas d'échec, le brouillon reste et le prochain envoi le reprend.
# L'application installée propose ensuite la mise à jour.
#
# À la demande (onglet Actions → « Run workflow ») : compilation seule, sans
# publication, pour récupérer les installeurs dans les artefacts. Ces
# compilations ne tournent pas à chaque envoi : sur un dépôt privé, les minutes
# de calcul sont comptées, et celles de macOS coûtent dix fois plus cher.
#
# Les versions sont publiées dans un dépôt public à part, pour que le code puisse
# rester privé : son adresse est dans apps/desktop/package.json (build.publish).
# Le secret RELEASES_TOKEN doit contenir un jeton autorisé à y écrire.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:tv
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: tv-tizen-webos
          path: dist-platforms


  # Envoi sur main : la version est-elle déjà publiée ? Sinon, on la prépare en brouillon.
  # Un seul brouillon créé ici, avant les compilations : quand chaque plateforme essayait
  # de créer la version en même temps, GitHub refusait (« Published releases must have a
  # valid tag ») et seule la version Windows était publiée.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret RELEASES_TOKEN absent : impossible de publier la version (voir le README, « Mises à jour automatiques »)." >&2
            exit 1
          fi
          repo=$(node -p "const p = require('./apps/desktop/package.json').build.publish[0]; p.owner + '/' + p.repo")
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "$tag est déjà publiée : rien à faire."
            echo publish=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Les nouveautés de la version accompagnent la publication (affichées par l'app installée).
          node scripts/release-notes.mjs
          if [ "$draft" = none ]; then
            gh release create "$tag" --repo "$repo" --draft --title "$version" --notes-file apps/desktop/release-notes.txt
            echo "$tag préparée en brouillon."
          else
            gh release edit "$tag" --repo "$repo" --notes-file apps/desktop/release-notes.txt
            echo "$tag : brouillon existant repris."
          fi
          echo publish=true >> "$GITHUB_OUTPUT"

  desktop:
    needs: [web, release]
    if: ${{ !cancelled() && needs.web.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release.outputs.publish == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:mpv
      - run: pnpm build

      # À la demande : simple compilation. Sur un envoi de nouvelle version : les fichiers
      # sont déposés dans le brouillon, avec le fichier « latest » que lit la mise à jour automatique.
      - name: Compiler l'application
        shell: bash
        working-directory: apps/desktop
        run: |
          publish=never
          if [[ "$PUBLISH" == true ]]; then publish=always; fi
          node ../../scripts/release-notes.mjs
          pnpm exec electron-builder --publish "$publish" -c.releaseInfo.releaseNotesFile=release-notes.txt
        env:
          PUBLISH: ${{ needs.release.outputs.publish }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  # Toutes les plateformes ont réussi : la version devient publique (la mise à jour est
  # proposée), et l'étiquette est posée ici sur le commit publié.
  publish:
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.outputs.publish == 'true' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rendre la version publique
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          repo=$(node -p "const p = require('./apps/desktop/package.json').build.publish[0]; p.owner + '/' + p.repo")
          gh release edit "$TAG" --repo "$repo" --draft=false --latest
      - name: Étiqueter le commit publié
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

  android:
    needs: [web, release]
    if: ${{ !cancelled() && needs.web.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release.outputs.publish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:sync
      - name: APK de débogage (téléphone, tablette, Android TV, Fire TV)
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
